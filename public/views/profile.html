<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - StudentMan</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../images/studentman_metua5.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="../images/studentman_metua5.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#7C3AED',
                        darkbg: '#0F172A',
                        darkcard: '#1E293B'
                    }
                }
            }
        }
    </script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <!-- Cloudinary -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script>
        // Detectar preferencia de modo oscuro del sistema
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }

        // Escuchar cambios en la preferencia del sistema
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 dark:from-darkbg dark:to-darkcard transition-colors duration-300">
    <!-- Header -->
    <header class="bg-white/80 dark:bg-darkcard/80 backdrop-blur-lg border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50 mb-8">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <a href="../index.html" class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-r from-primary to-secondary rounded-xl flex items-center justify-center">
                        <i class="fas fa-graduation-cap text-white text-lg"></i>
                    </div>
                    <h3 class="font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent md:text-2xl">
                        StudentMan
                    </h3>
                </a>
                <a href="../index.html" class="text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors duration-300">
                    <i class="fas fa-arrow-left mr-2"></i>
                    Volver
                </a>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8">
        <div class="max-w-4xl mx-auto">
            <!-- Perfil Header -->
            <div class="bg-white/80 dark:bg-darkcard/80 backdrop-blur-lg border border-gray-200 dark:border-gray-700/50 p-8 mb-8 rounded-2xl shadow-xl">
                <div class="flex flex-col md:flex-row items-center gap-8">
                    <div class="relative group">
                        <div class="w-32 h-32 rounded-full overflow-hidden bg-gradient-to-r from-primary to-secondary p-1">
                            <img id="profile-image" src="https://ui-avatars.com/api/?name=Usuario&background=7C3AED&color=fff" 
                                 alt="Foto de perfil" 
                                 class="w-full h-full rounded-full object-cover">
                        </div>
                        <button id="upload-photo-btn" class="absolute bottom-0 right-0 bg-white dark:bg-darkcard rounded-full p-2 shadow-lg hover:scale-110 transition-transform duration-300">
                            <i class="fas fa-camera text-primary"></i>
                        </button>
                    </div>
                    <div class="flex-1 text-center md:text-left">
                        <h1 id="profile-name" class="text-3xl font-bold text-gray-800 dark:text-white mb-2">Nombre del Usuario</h1>
                        <p id="profile-email" class="text-gray-600 dark:text-gray-400 mb-4">estudiante@email.com</p>
                        <div class="flex flex-wrap gap-4 justify-center md:justify-start">
                            <div class="bg-gray-50 dark:bg-darkbg rounded-xl px-6 py-3 shadow-md border border-gray-200 dark:border-gray-700/50">
                                <p class="text-sm text-gray-500 dark:text-gray-400">Materias</p>
                                <p id="materias-count" class="text-xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">0</p>
                            </div>
                            <div class="bg-gray-50 dark:bg-darkbg rounded-xl px-6 py-3 shadow-md border border-gray-200 dark:border-gray-700/50">
                                <p class="text-sm text-gray-500 dark:text-gray-400">Apuntes</p>
                                <p id="apuntes-count" class="text-xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">0</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Configuración -->
            <div class="bg-white/80 dark:bg-darkcard/80 backdrop-blur-lg border border-gray-200 dark:border-gray-700/50 p-8 rounded-2xl shadow-xl">
                <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-6">Configuración</h2>
                
                <!-- Formulario -->
                <form id="profile-form" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Nombre -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                Nombre
                            </label>
                            <input type="text" 
                                   id="input-nombre"
                                   name="nombre"
                                   class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-darkbg text-gray-800 dark:text-white focus:ring-2 focus:ring-primary dark:focus:ring-secondary focus:border-transparent outline-none transition-all duration-300"
                                   placeholder="Tu nombre"
                                   required>
                        </div>
                        
                        <!-- Email -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                Email
                            </label>
                            <input type="email" 
                                   id="input-email"
                                   name="email"
                                   class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-100 dark:bg-gray-900 text-gray-600 dark:text-gray-400 cursor-not-allowed"
                                   placeholder="tu@email.com"
                                   readonly
                                   disabled>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">El email no se puede modificar</p>
                        </div>

                        <!-- Universidad -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                Universidad
                            </label>
                            <input type="text" 
                                   id="input-universidad"
                                   name="universidad"
                                   class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-darkbg text-gray-800 dark:text-white focus:ring-2 focus:ring-primary dark:focus:ring-secondary focus:border-transparent outline-none transition-all duration-300"
                                   placeholder="Nombre de tu universidad">
                        </div>

                        <!-- Carrera -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                Carrera
                            </label>
                            <input type="text" 
                                   id="input-carrera"
                                   name="carrera"
                                   class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-darkbg text-gray-800 dark:text-white focus:ring-2 focus:ring-primary dark:focus:ring-secondary focus:border-transparent outline-none transition-all duration-300"
                                   placeholder="Tu carrera">
                        </div>
                    </div>

                    <!-- Botones -->
                    <div class="flex justify-end space-x-4 pt-6">
                        <button type="button" 
                                onclick="window.location.href='../index.html'"
                                class="px-6 py-2 rounded-xl bg-gray-100 dark:bg-darkbg border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition-all duration-300">
                            Cancelar
                        </button>
                        <button type="submit" 
                                class="px-6 py-2 rounded-xl bg-gradient-to-r from-primary to-secondary text-white hover:opacity-90 transition-all duration-300 shadow-lg hover:shadow-primary/20">
                            Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../js/user-utils.js"></script>
    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB-5z-xwAmReLjNGPdnwB2Ff7jjtCk9_aQ",
            authDomain: "studentman-13c8f.firebaseapp.com",
            projectId: "studentman-13c8f",
            storageBucket: "studentman-13c8f.firebasestorage.app",
            messagingSenderId: "380344615554",
            appId: "1:380344615554:web:a7c15289f49c49e7ff2a9b",
        };

        // Inicializar Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Variables globales
        let currentUser = null;
        let cloudinaryConfig = null;
        let cloudinaryWidget = null;

        // Cargar configuración de Cloudinary
        async function cargarConfiguracion() {
            try {
                const baseUrl = window.location.origin;
                const response = await fetch(`${baseUrl}/api/config`);
                if (!response.ok) throw new Error('Error al obtener la configuración');
                
                const config = await response.json();
                cloudinaryConfig = config.cloudinary;
                
                // Inicializar widget de Cloudinary
                cloudinaryWidget = cloudinary.createUploadWidget(
                    {
                        cloudName: cloudinaryConfig.cloudName,
                        uploadPreset: cloudinaryConfig.uploadPreset,
                        sources: ['local', 'camera'],
                        multiple: false,
                        maxFileSize: 5000000, // 5MB
                        cropping: true,
                        croppingAspectRatio: 1,
                        croppingShowDimensions: true,
                        folder: 'profile-photos',
                        clientAllowedFormats: ['png', 'jpg', 'jpeg', 'gif', 'webp'],
                        maxImageWidth: 500,
                        maxImageHeight: 500,
                    },
                    (error, result) => {
                        if (error) {
                            console.error('Error al subir imagen:', error);
                            mostrarAlerta('Error al subir la imagen', 'error');
                            return;
                        }
                        
                        if (result.event === 'success') {
                            const imageUrl = result.info.secure_url;
                            document.getElementById('profile-image').src = imageUrl;
                            guardarFotoPerfil(imageUrl);
                        }
                    }
                );
                
                console.log('Configuración de Cloudinary cargada');
            } catch (error) {
                console.error('Error al cargar configuración:', error);
                mostrarAlerta('Error al cargar la configuración', 'error');
            }
        }

        // Verificar autenticación
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                console.log('Usuario autenticado:', user.email);
                await cargarDatosUsuario();
            } else {
                // Redirigir al login si no está autenticado
                window.location.href = 'login.html';
            }
        });

        // Cargar datos del usuario
        async function cargarDatosUsuario() {
            if (!currentUser) return;

            try {
                // Mostrar loader
                mostrarLoader(true);

                // Obtener datos del usuario desde Firestore
                const userDoc = await db.collection('usuarios').doc(currentUser.uid).get();
                const userData = userDoc.exists ? userDoc.data() : {};

                // Actualizar UI con datos del usuario
                document.getElementById('profile-name').textContent = userData.nombre || currentUser.displayName || 'Usuario';
                document.getElementById('profile-email').textContent = currentUser.email;
                
                // Actualizar foto de perfil
                const photoUrl = userData.photoUrl || currentUser.photoURL;
                if (photoUrl) {
                    document.getElementById('profile-image').src = photoUrl;
                } else {
                    const initials = (userData.nombre || currentUser.displayName || 'U').split(' ').map(n => n[0]).join('').toUpperCase();
                    document.getElementById('profile-image').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(initials)}&background=7C3AED&color=fff&size=200`;
                }

                // Llenar formulario
                document.getElementById('input-nombre').value = userData.nombre || currentUser.displayName || '';
                document.getElementById('input-email').value = currentUser.email;
                document.getElementById('input-universidad').value = userData.universidad || '';
                document.getElementById('input-carrera').value = userData.carrera || '';

                // Mostrar mensaje de bienvenida si es la primera vez
                if (!userData.nombre && !userData.universidad && !userData.carrera) {
                    mostrarAlerta('¡Bienvenido! Completa tu perfil para comenzar', 'info');
                }

                // Contar materias únicas del horario
                const horarioDoc = await db.collection('usuarios')
                    .doc(currentUser.uid)
                    .collection('configuracion')
                    .doc('horario')
                    .get();
                
                let materiasCount = 0;
                if (horarioDoc.exists) {
                    const horario = horarioDoc.data();
                    const materiasUnicas = new Set();
                    if (horario.materiasInfo) {
                        Object.keys(horario.materiasInfo).forEach(codigo => {
                            materiasUnicas.add(codigo);
                        });
                    }
                    materiasCount = materiasUnicas.size;
                }
                document.getElementById('materias-count').textContent = materiasCount;

                // Contar apuntes del usuario
                const apuntesSnapshot = await db.collection('apuntes')
                    .where('userId', '==', currentUser.uid)
                    .get();
                document.getElementById('apuntes-count').textContent = apuntesSnapshot.size;

                mostrarLoader(false);
            } catch (error) {
                console.error('Error al cargar datos del usuario:', error);
                mostrarAlerta('Error al cargar los datos del perfil', 'error');
                mostrarLoader(false);
            }
        }

        // Guardar foto de perfil
        async function guardarFotoPerfil(photoUrl) {
            if (!currentUser) return;

            try {
                // Actualizar en Firestore
                await db.collection('usuarios').doc(currentUser.uid).set({
                    photoUrl: photoUrl,
                    updatedAt: new Date()
                }, { merge: true });

                // Actualizar en Firebase Auth
                await currentUser.updateProfile({
                    photoURL: photoUrl
                });

                mostrarAlerta('Foto de perfil actualizada', 'success');
            } catch (error) {
                console.error('Error al guardar foto:', error);
                mostrarAlerta('Error al guardar la foto de perfil', 'error');
            }
        }

        // Manejar clic en botón de subir foto
        document.getElementById('upload-photo-btn').addEventListener('click', () => {
            if (cloudinaryWidget) {
                cloudinaryWidget.open();
            } else {
                mostrarAlerta('Cargando configuración...', 'info');
            }
        });

        // Manejar envío del formulario
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentUser) return;

            try {
                mostrarLoader(true);

                const nombre = document.getElementById('input-nombre').value.trim();
                const universidad = document.getElementById('input-universidad').value.trim();
                const carrera = document.getElementById('input-carrera').value.trim();

                // Actualizar en Firestore
                await db.collection('usuarios').doc(currentUser.uid).set({
                    nombre: nombre,
                    universidad: universidad,
                    carrera: carrera,
                    email: currentUser.email,
                    updatedAt: new Date()
                }, { merge: true });

                // Actualizar displayName en Firebase Auth
                await currentUser.updateProfile({
                    displayName: nombre
                });

                // Actualizar UI
                document.getElementById('profile-name').textContent = nombre;

                mostrarLoader(false);
                mostrarAlerta('Cambios guardados exitosamente', 'success');

            } catch (error) {
                console.error('Error al guardar cambios:', error);
                mostrarLoader(false);
                mostrarAlerta('Error al guardar los cambios', 'error');
            }
        });

        // Funciones auxiliares
        function mostrarLoader(show) {
            const submitBtn = document.querySelector('#profile-form button[type="submit"]');
            if (show) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Guardando...';
            } else {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Guardar Cambios';
            }
        }

        function mostrarAlerta(mensaje, tipo = 'info') {
            const colores = {
                success: 'from-green-500 to-green-600',
                error: 'from-red-500 to-red-600',
                info: 'from-blue-500 to-blue-600'
            };

            const iconos = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };

            const alerta = document.createElement('div');
            alerta.className = 'fixed top-4 right-4 z-50 animate-fade-in-down';
            alerta.innerHTML = `
                <div class="bg-white dark:bg-darkcard rounded-xl shadow-2xl p-4 min-w-[300px] border border-gray-200 dark:border-gray-700">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-r ${colores[tipo]} flex items-center justify-center flex-shrink-0">
                            <i class="fas ${iconos[tipo]} text-white"></i>
                        </div>
                        <p class="text-gray-800 dark:text-white font-medium">${mensaje}</p>
                    </div>
                </div>
            `;

            document.body.appendChild(alerta);

            setTimeout(() => {
                alerta.style.opacity = '0';
                alerta.style.transform = 'translateY(-20px)';
                alerta.style.transition = 'all 0.3s ease';
                setTimeout(() => alerta.remove(), 300);
            }, 3000);
        }

        // Cargar configuración al iniciar
        cargarConfiguracion();
    </script>
    
    <style>
        @keyframes fade-in-down {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-down {
            animation: fade-in-down 0.3s ease-out;
        }
    </style>
</body>
</html>
