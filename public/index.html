<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Apuntes Académicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1259.0.min.js"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <!-- CSS de Fancybox -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- JS de Fancybox -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.js"></script>

    <!-- CSS de Plyr -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <!-- JS de Plyr -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
</head>

<body class="bg-gray-100">
    <div class="container mx-auto px-4">
        <h1 class="text-3xl font-bold text-center my-8">Gestor de Apuntes Académicos</h1>

        <!-- Botón para editar horario -->
        <div class="text-right mb-4">
            <button id="editar-horario" class="bg-blue-500 text-white px-4 py-2 rounded">Editar Horario</button>
        </div>

        <!-- Horario Semanal -->
        <div id="horario-semanal" class="mb-8">
            <!-- Se llenará dinámicamente con JavaScript -->
        </div>

        <!-- Modal para Registro de Apuntes y Materias -->
        <div id="modal-apuntes" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full">
            <!-- Contenido del modal -->
        </div>

        <!-- Barra de Búsqueda y Filtros -->
        <div id="busqueda" class="mb-8">
            <input type="text" id="busqueda-input" placeholder="Buscar apuntes..." class="w-full p-2 border rounded">
        </div>

        <!-- Resultados de Búsqueda -->
        <div id="resultados-busqueda" class="mb-8">
            <!-- Se llenará dinámicamente con JavaScript -->
        </div>

        <!-- Apuntes Recientes -->
        <div id="apuntes-recientes" class="mb-8">
            <h2 class="text-2xl font-bold mb-4">Apuntes Recientes</h2>
            <!-- Se llenará dinámicamente con JavaScript -->
        </div>
    </div>

    <script src="js/index.js"></script>
</body>

</html>
