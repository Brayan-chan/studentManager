<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Apuntes Académicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1259.0.min.js"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>

<body class="bg-gray-100">
    <div class="container mx-auto px-4">
        <h1 class="text-3xl font-bold text-center my-8">Gestor de Apuntes Académicos</h1>

        <!-- Horario Semanal -->
        <div id="horario-semanal" class="mb-8">
            <!-- Se llenará dinámicamente con JavaScript -->
        </div>

        <!-- Modal para Registro de Apuntes -->
        <div id="modal-apuntes" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full">
            <!-- Contenido del modal -->
        </div>

        <!-- Barra de Búsqueda y Filtros -->
        <div id="busqueda" class="mb-8">
            <input type="text" id="busqueda-input" placeholder="Buscar apuntes..." class="w-full p-2 border rounded">
            <!-- Agregar más filtros aquí -->
        </div>

        <!-- Resultados de Búsqueda -->
        <div id="resultados-busqueda" class="mb-8">
            <!-- Se llenará dinámicamente con JavaScript -->
        </div>

        <!-- Apuntes Recientes -->
        <div id="apuntes-recientes" class="mb-8">
            <h2 class="text-2xl font-bold mb-4">Apuntes Recientes</h2>
            <!-- Se llenará dinámicamente con JavaScript -->
        </div>
    </div>

    <script>
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyAE8MjtNo2Ilz6wVcKobw5KsX2OY9p-S-M",
            authDomain: "studentman-8fada.firebaseapp.com",
            projectId: "studentman-8fada",
            storageBucket: "studentman-8fada.firebasestorage.app",
            messagingSenderId: "623765351128",
            appId: "1:623765351128:web:4a8cb3d83c3a1ea1e405ad",
            measurementId: "G-G39C51KY6M"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Amazon S3 Config
        AWS.config.update({
            accessKeyId: 'AKIATG6MGWYEX7HDZSCK',
            secretAccessKey: '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',
            region: 'us-east-2' // Ejemplo: 'us-east-1'
        });
        const s3 = new AWS.S3();
        const S3_BUCKET_NAME = 'audiosawsbucket';

        // Configuración de Cloudinary
        const CLOUDINARY_CLOUD_NAME = 'dmyejrbs7';
        const CLOUDINARY_UPLOAD_PRESET = 'apuntes'; // ejemplo: 'apuntes_academicos'

        // Función para cargar el horario semanal
        function cargarHorarioSemanal() {
            const horario = document.getElementById('horario-semanal');
            const dias = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
            const horas = ['8:00', '9:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00'];
            const materias = ['Matemáticas', 'Física', 'Química', 'Historia', 'Literatura'];

            let tabla = '<table class="w-full border-collapse border border-gray-300">';
            tabla += '<tr><th class="border p-2">Hora</th>' + dias.map(dia => `<th class="border p-2">${dia}</th>`).join('') + '</tr>';

            horas.forEach((hora, i) => {
                tabla += `<tr>
                <td class="border p-2">${hora}</td>
                ${dias.map((dia, j) => `
                    <td class="border p-2">
                        <select onchange="seleccionarMateria(this, '${dia}', '${hora}')" class="w-full p-1 border rounded">
                            <option value="">Seleccionar</option>
                            ${materias.map(materia => `<option value="${materia}">${materia}</option>`).join('')}
                        </select>
                    </td>
                `).join('')}
            </tr>`;
            });

            tabla += '</table>';
            horario.innerHTML = tabla;
        }

        // Función para seleccionar una materia
        function seleccionarMateria(select, dia, hora) {
            const materia = select.value;
            if (materia) {
                abrirModalApuntes(dia, hora, materia);
            }
        }

        // Función para abrir el modal de apuntes
        function abrirModalApuntes(dia, hora, materia) {
            const modal = document.getElementById('modal-apuntes');
            modal.classList.remove('hidden');
            modal.innerHTML = `
                <div class="modal-content bg-white p-4 w-full max-w-md mx-auto mt-20 rounded shadow-lg">
                    <h2 class="text-2xl font-bold mb-4">Registrar Apunte - ${materia}</h2>
                    <p class="mb-2">${dia} - ${hora}</p>
                    <textarea id="texto-apunte" class="w-full p-2 border rounded mb-4" placeholder="Escribe tu apunte aquí..."></textarea>
                    <button id="subir-foto" class="bg-blue-500 text-white p-2 rounded mr-2">Subir Foto</button>
                    <button id="grabar-audio" class="bg-blue-500 text-white p-2 rounded mr-2">Grabar Audio</button>
                    <button onclick="guardarApunte('${dia}', '${hora}', '${materia}')" class="bg-green-500 text-white p-2 rounded mr-2">Guardar Apunte</button>
                    <button onclick="cerrarModalApuntes()" class="bg-red-500 text-white p-2 rounded">Cerrar</button>
                </div>
            `;

            document.getElementById('subir-foto').addEventListener('click', subirFoto);
            document.getElementById('grabar-audio').addEventListener('click', grabarAudio);
        }

        function cerrarModalApuntes() {
            document.getElementById('modal-apuntes').classList.add('hidden');
        }

        // Función para subir una foto usando Cloudinary
        let fotoUrl = null; // Variable global para almacenar la URL de la imagen
        let mediaRecorder;
        let audioChunks = [];
        let audioUrl = null; // URL del audio
        let audioBlob = null; // Blob del audio

        function subirFoto() {
            const myWidget = cloudinary.createUploadWidget({
                cloudName: CLOUDINARY_CLOUD_NAME,
                uploadPreset: CLOUDINARY_UPLOAD_PRESET
            }, (error, result) => {
                if (!error && result && result.event === "success") {
                    console.log('Imagen subida con éxito:', result.info.secure_url);
                    fotoUrl = result.info.secure_url; // Asignar la URL globalmente
                    // Mostrar previsualización de la imagen en el modal
                    const imgPreview = document.createElement('img');
                    imgPreview.src = fotoUrl;
                    imgPreview.alt = "Imagen subida";
                    imgPreview.className = 'mt-2 max-w-full h-auto';
                    document.querySelector('.modal-content').appendChild(imgPreview);
                } else if (error) {
                    console.error('Error al subir la imagen:', error);
                }
            });
            myWidget.open();
        }

        async function subirAudio(blob) {
            const audioKey = `audios/${Date.now()}.webm`;
            const params = {
                Bucket: 'audiosawsbucket', // Nombre exacto del bucket
                Key: 'audios/' + Date.now() + '.webm',
                Body: blob,
                ContentType: 'audio/webm'
            };            
        
            try {
                const data = await s3.upload(params).promise();
                console.log('Audio subido con éxito:', data.Location);
                return data.Location;
            } catch (error) {
                console.error('Error al subir el audio:', error);
                alert('Hubo un error al subir el audio. Por favor, revisa la consola para más detalles.');
                return null;
            }
        }        

        // Función para grabar audio
        function grabarAudio() {
            const button = document.getElementById('grabar-audio');

            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                button.textContent = 'Grabar Audio';
                return;
            }

            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    button.textContent = 'Detener Grabación';

                    audioChunks = [];
                    mediaRecorder.addEventListener("dataavailable", event => {
                        audioChunks.push(event.data);
                    });

                    mediaRecorder.addEventListener("stop", async () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        audioUrl = await subirAudio(blob); // Subir audio a S3
                        if (audioUrl) {
                            const audioElement = document.createElement('audio');
                            audioElement.src = audioUrl;
                            audioElement.controls = true;
                            audioElement.className = 'mt-2';
                            document.querySelector('.modal-content').appendChild(audioElement);
                        }
                    });                                      
                })
                .catch(error => console.error('Error al grabar audio:', error));
        }

        async function guardarApunte(dia, hora, materia) {
            const texto = document.getElementById('texto-apunte').value;
        
            if (!fotoUrl && !audioUrl) {
                alert('Por favor, agrega una foto o audio antes de guardar.');
                return;
            }
        
            // Aquí eliminamos la redeclaración de audioUrl
            const apunte = {
                texto,
                materia,
                dia,
                hora,
                fecha: new Date(),
                fotoUrl: fotoUrl || null,
                audioUrl: audioUrl || null // Utilizamos la variable global directamente
            };
        
            try {
                await db.collection('apuntes').add(apunte);
                cerrarModalApuntes();
                cargarApuntesRecientes();
            } catch (error) {
                console.error('Error al guardar el apunte: ', error);
            }
        }        

        // Función para buscar apuntes
        function buscarApuntes() {
            const busqueda = document.getElementById('busqueda-input').value.toLowerCase();

            db.collection('apuntes').get().then((querySnapshot) => {
                let resultados = '';
                querySnapshot.forEach((doc) => {
                    const apunte = doc.data();
                    if (apunte.texto.toLowerCase().includes(busqueda) || apunte.materia.toLowerCase().includes(busqueda)) {
                        resultados += `
                        <div class="mb-4 p-4 bg-white rounded shadow">
                            <p class="font-bold">${apunte.materia} - ${apunte.dia} ${apunte.hora}</p>
                            <p>${apunte.texto}</p>
                            <p class="text-sm text-gray-500">${apunte.fecha.toDate().toLocaleString()}</p>
                            ${apunte.fotoUrl ? `<img src="${apunte.fotoUrl}" alt="Foto del apunte" class="mt-2 max-w-full h-auto">` : ''}
                            ${apunte.audioUrl ? `<audio controls src="${apunte.audioUrl}" class="mt-2">Tu navegador no soporta el elemento audio.</audio>` : ''}
                        </div>
                    `;
                    }
                });
                document.getElementById('resultados-busqueda').innerHTML = resultados || '<p>No se encontraron resultados.</p>';
            }).catch((error) => {
                console.error("Error al buscar apuntes: ", error);
            });
        }

        // Función para cargar apuntes recientes
        function cargarApuntesRecientes() {
            const dosdiasatras = new Date();
            dosdiasatras.setDate(dosdiasatras.getDate() - 2);

            db.collection('apuntes')
                .where('fecha', '>=', dosdiasatras)
                .orderBy('fecha', 'desc')
                .limit(10)
                .get()
                .then(querySnapshot => {
                    let apuntes = '';
                    querySnapshot.forEach(doc => {
                        const apunte = doc.data();
                        apuntes += `
                        <div class="mb-4 p-4 bg-white rounded shadow">
                            <p class="font-bold">${apunte.materia} - ${apunte.dia} ${apunte.hora}</p>
                            <p>${apunte.texto}</p>
                            <p class="text-sm text-gray-500">${apunte.fecha.toDate().toLocaleString()}</p>
                            ${apunte.fotoUrl ? `<img src="${apunte.fotoUrl}" alt="Foto del apunte" class="mt-2 max-w-full h-auto">` : ''}
                            ${apunte.audioUrl ? `<audio controls src="${apunte.audioUrl}" class="mt-2">Tu navegador no soporta el elemento audio.</audio>` : ''}
                        </div>
                    `;
                    });
                    document.getElementById('apuntes-recientes').innerHTML = apuntes || '<p>No hay apuntes recientes.</p>';
                })
                .catch((error) => {
                    console.error("Error al cargar apuntes recientes: ", error);
                });
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            cargarHorarioSemanal();
            cargarApuntesRecientes();
            document.getElementById('busqueda-input').addEventListener('input', buscarApuntes);
        });
    </script>
</body>

</html>
